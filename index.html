<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <title>ទម្រង់ដាក់ពាក្យធ្វើការ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f8ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .form-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      width: 350px;
    }
    .form-container h2 {
      text-align: center;
      color: #007acc;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #005f99;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>ដាក់ពាក្យធ្វើការ</h2>
    <form id="jobForm">
      <input type="text" placeholder="ឈ្មោះពេញ" required>
      <input type="email" placeholder="អ៊ីមែល" required>
      <input type="tel" placeholder="លេខទូរស័ព្ទ" required>
      <input type="file" accept=".pdf,.doc,.docx" required>
      <textarea placeholder="សារបន្ថែម..." rows="4"></textarea>
      <button type="submit">ដាក់ពាក្យ</button>
    </form>
  </div>

  <script>
    document.getElementById("jobForm").addEventListener("submit", function(e){
      e.preventDefault();
      alert("ការដាក់ពាក្យរបស់អ្នកត្រូវបានផ្ញើ!");
      // នៅទីនេះ អ្នកអាចបន្ថែម API call ដើម្បីផ្ញើទិន្នន័យទៅ Server
    });
  </script>
</body>
</html>
